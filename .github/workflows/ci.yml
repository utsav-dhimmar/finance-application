name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repository. Third-party
# actions are pinned to full commit SHAs (with version comments) so a moved
# tag can never inject changed code into the build.
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pnpm
        # v4.1.0
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - name: Install Node.js
        # v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Persist Turborepo task cache
        # v4.3.0
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .turbo
          # Loose restore keys are safe: turbo only replays cache entries whose
          # computed input hash matches, so stale entries can never feed
          # wrong results.
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-

      - name: Build, typecheck, lint, test
        env:
          TURBO_CACHE_DIR: .turbo
          TURBO_TELEMETRY_DISABLED: "1"
        run: pnpm turbo run typecheck lint test build test:workers
